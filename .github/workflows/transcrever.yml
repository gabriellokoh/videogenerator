
name: Transcrever Audio

on:
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Whisper
        run: pip install faster-whisper

      - name: Transcrever
        run: |
          python - <<'EOF'
          import json
          from faster_whisper import WhisperModel

          model = WhisperModel("small", device="cpu", compute_type="int8")

          segments, _ = model.transcribe(
              "audio.mp3",
              task="transcribe",
              word_timestamps=True
          )

          words = []
          for s in segments:
              for w in s.words:
                  words.append({
                      "word": w.word.strip(),
                      "start": round(w.start, 2),
                      "end": round(w.end, 2)
                  })

          with open("words.json", "w", encoding="utf-8") as f:json.dump(words, f, ensure_ascii=False, indent=2)
          EOF

      - name: Salvar timestamps
        uses: actions/upload-artifact@v4
        with:
          name: timestamps
          path: words.json
